# Paste this block into UltimateDonutSmp's plugins/UltimateDonutSmp/crates.yml
# directly UNDER the existing crates (same indentation as "gold:" - two spaces, inside CRATES:).
# Then run /crate reload.
# Requires DillyyXmas (the rewards use /xmas give). {player} is replaced by the crate plugin.

  christmas:
    ENABLED: true
    OPEN-TYPE: GACHA
    DISPLAY:
      MATERIAL: RED_SHULKER_BOX
      DISPLAY-NAME: '&c&lChristmas &a&lCrate'
      LORE:
      - '&7Keys: &f{keys}'
      - '&aClick to open and roll a reward.'
    KEY-ITEM:
      MATERIAL: TRIPWIRE_HOOK
      DISPLAY-NAME: '&c&lChristmas &a&lkey'
      LORE:
      - '&7Opens the &cChristmas &aCrate&7.'
    PERMISSION: ''
    BROADCAST-ON-CLAIM: true
    MENU:
      OPEN-TITLE: '&8Christmas Crate'
      CONFIRM-TITLE: '&8Confirm Christmas Reward'
      SIZE: 27
      FILLER: RED_STAINED_GLASS_PANE
      BACK-SLOT: 26
      BACK-BUTTON:
        MATERIAL: BARRIER
        DISPLAY-NAME: '&cBack'
        LORE:
        - '&7Return to the crate list.'
    REWARDS:
      santa_hat:
        SLOT: 10
        DISPLAY:
          MATERIAL: LEATHER_HELMET
          DISPLAY-NAME: '&c&lSanta Hat'
          LORE:
          - '&7Protection IV, Unbreaking III, Respiration III'
          AMOUNT: 1
          ENCHANTMENTS: []
        GRANT:
          TYPE: COMMAND
          COMMANDS:
          - xmas give {player} santa_hat
      reindeer_boots:
        SLOT: 11
        DISPLAY:
          MATERIAL: LEATHER_BOOTS
          DISPLAY-NAME: '&6&lReindeer Boots'
          LORE:
          - '&7Protection IV, Feather Falling IV, Depth Strider III'
          AMOUNT: 1
          ENCHANTMENTS: []
        GRANT:
          TYPE: COMMAND
          COMMANDS:
          - xmas give {player} reindeer_boots
      candy_cane_sword:
        SLOT: 12
        DISPLAY:
          MATERIAL: DIAMOND_SWORD
          DISPLAY-NAME: '&c&lCandy &f&lCane &c&lBlade'
          LORE:
          - '&7Sharpness IV, Looting III, Unbreaking III'
          AMOUNT: 1
          ENCHANTMENTS: []
        GRANT:
          TYPE: COMMAND
          COMMANDS:
          - xmas give {player} candy_cane_sword
      candy_cane_pickaxe:
        SLOT: 13
        DISPLAY:
          MATERIAL: DIAMOND_PICKAXE
          DISPLAY-NAME: '&c&lCandy &f&lCane &c&lPickaxe'
          LORE:
          - '&7Efficiency V, Fortune III, Unbreaking III'
          AMOUNT: 1
          ENCHANTMENTS: []
        GRANT:
          TYPE: COMMAND
          COMMANDS:
          - xmas give {player} candy_cane_pickaxe
      frost_wand:
        SLOT: 14
        DISPLAY:
          MATERIAL: BLAZE_ROD
          DISPLAY-NAME: '&b&lFrost Wand'
          LORE:
          - '&7Right-click to fire an ice bolt that slows enemies.'
          AMOUNT: 1
          ENCHANTMENTS: []
        GRANT:
          TYPE: COMMAND
          COMMANDS:
          - xmas give {player} frost_wand
      christmas_money:
        SLOT: 15
        DISPLAY:
          MATERIAL: GOLD_INGOT
          DISPLAY-NAME: '&a$25,000,000'
          LORE:
          - '&7Christmas bonus!'
          AMOUNT: 1
          ENCHANTMENTS: []
        GRANT:
          TYPE: COMMAND
          COMMANDS:
          - addmoney {player} 25000000
      christmas_shards:
        SLOT: 16
        DISPLAY:
          MATERIAL: AMETHYST_SHARD
          DISPLAY-NAME: '&d750 Shards'
          LORE:
          - '&7Christmas bonus!'
          AMOUNT: 1
          ENCHANTMENTS: []
        GRANT:
          TYPE: COMMAND
          COMMANDS:
          - addshards {player} 750
