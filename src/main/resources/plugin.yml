name: DillyyXmas
version: 1.2
main: me.fix.xmas.Xmas
api-version: "1.21"
commands:
  xmas:
    description: Christmas info and admin tools
    usage: /xmas [snow|present|give|boss|mailbox|timezone|reset|reload]
    aliases: [christmas]
  advent:
    description: Open the advent calendar
    usage: /advent
permissions:
  xmas.use:
    default: true
  xmas.mailbox.use:
    description: Use Christmas Mailboxes (send and collect gifts)
    default: true
  xmas.admin:
    default: op
